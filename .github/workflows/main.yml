name: Stock Alert

on:
  schedule:
    - cron: '30 3 * * *'   # Daily 9:00 AM IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install yfinance pandas

      - name: Run script
        run: python alert.py
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
